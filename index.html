<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>塾管理システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://yubinbango.github.io/yubinbango/yubinbango.js" charset="UTF-8"></script>
    <!-- jsPDF の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- html2canvas の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; overflow-x:hidden; touch-action: manipulation; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-btn { flex: 1; padding: 12px 2px; font-weight: bold; font-size: 11px; transition: all 0.2s; white-space: nowrap; border-bottom: 3px solid transparent; text-align: center; }
        
        #nav1 { background: #b3d7ff !important; color: #4a5568; border-bottom-color: #80bfff; }
        #nav2 { background: #ffeaa7 !important; color: #4a5568; border-bottom-color: #ffe066; }
        #nav3 { background: #b2f2bb !important; color: #4a5568; border-bottom-color: #8ce99a; }
        #nav8 { background: #ffd8a8 !important; color: #4a5568; border-bottom-color: #ffa94d; }
        #nav5 { background: #eebefa !important; color: #4a5568; border-bottom-color: #d896ff; }
        #nav6 { background: #f1f3f5 !important; color: #4a5568; border-bottom-color: #ced4da; }
        #nav7 { background: #fff59d !important; color: #4a5568; border-bottom-color: #fdd835; }
        
        .nav-btn:not(.nav-active-tab) { background: #f8fafc !important; color: #64748b !important; border-bottom-color: transparent !important; }
        .btn-main { background-color: #3b82f6; color: white; padding: 16px; border-radius: 8px; font-weight: bold; width: 100%; }
        .input-styled { border: 2px solid #cbd5e1; padding: 10px; border-radius: 6px; width: 100%; background: #f8fafc; color: #000000; font-weight: 500; box-sizing: border-box; -webkit-appearance: none; display: block; font-size: 14px; min-height: 44px; }
        .grade-box { border: 2px solid #cbd5e1; padding: 10px; border-radius: 6px; width: 100%; background: #f8fafc; font-size: 16px; box-sizing: border-box; }
        .grade-value { color: #000000; font-weight: 500; }
        
        .grid-row { display: grid; grid-template-columns: 1fr 1fr auto; align-items: center; gap: 6px; padding: 12px 10px; border: 1px solid #e2e8f0; border-radius: 8px; background: white; max-width: 600px; margin: 0 auto; }
        .att-btn { border: 1px solid #cbd5e1; padding: 6px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        
        .student-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid #e2e8f0; background: white; }
        .student-main-info { display: flex; align-items: baseline; gap: 6px; }
        .student-schedules { grid-column: 1 / span 3; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
        
        .rem-count { font-weight: bold; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
        .rem-positive { color: #ef4444; border: 1px solid #ef4444; }
        .rem-zero { background: #cbd5e1; color: white; }
        
        .makeup-container { padding: 10px; }
        .makeup-group { margin-bottom: 16px; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
        .makeup-name-header { background: #f1f5f9; padding: 8px; font-weight: bold; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; cursor: pointer; }
        .makeup-row { display: grid; grid-template-columns: 1.4fr 1.5fr auto auto; align-items: center; gap: 6px; padding: 8px; border-bottom: 1px solid #f1f5f9; background: white; font-size: 12px; }
        .makeup-orig { color: #475569; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .makeup-inputs { display: flex; gap: 2px; }
        .makeup-inputs input, .makeup-inputs select { width: 100%; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 11px; }
        .makeup-btn { padding: 6px 10px; background: #3b82f6; color: white; border-radius: 4px; font-weight: bold; font-size: 11px; white-space: nowrap; text-align: center; }
        .cancel-btn { padding: 6px 10px; background: #ef4444; color: white; border-radius: 4px; font-weight: bold; font-size: 11px; white-space: nowrap; text-align: center; }
        .delete-makeup-btn { padding: 6px 10px; background: #64748b; color: white; border-radius: 4px; font-weight: bold; font-size: 11px; white-space: nowrap; text-align: center; }

        .sm-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-bottom: 4px; align-items: center; }
        .sm-input { height: 36px !important; font-size: 12px !important; padding: 2px !important; }

        .scrollTop-btn { position: fixed; bottom: 24px; right: 24px; z-index: 40; opacity: 0.6; transition: opacity 0.25s ease, transform 0.2s ease; }
        .scrollTop-btn:hover { opacity: 1; }
        .scrollTop-btn button { background-color: transparent; color: #1d4ed8; width: 56px; height: 56px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px solid #1d4ed8; cursor: pointer; padding: 4px; }
        .scrollTop-btn button:hover { background-color: rgba(29, 78, 216, 0.1); transform: translateY(-2px); }
        .scrollTop-btn button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 2px; }
        .scrollTop-btn button span { font-size: 10px; font-weight: 800; letter-spacing: 0.5px; line-height: 1; color: #1d4ed8; }
        
        @media print {
            body * { visibility: hidden; }
            #range-result-area, #range-result-area * { visibility: visible; }
            #range-result-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }

        @media (min-width: 768px) {
            .max-w-xl { max-width: 1100px !important; display: grid !important; grid-template-columns: 200px 1fr; gap: 20px; align-items: start; }
            nav { flex-direction: column !important; border-bottom: none !important; background: #f1f5f9 !important; border-radius: 8px; }
            .nav-btn { text-align: center; border-bottom: none !important; border-left: 4px solid transparent !important; }
            
            .name-display-area { display: inline !important; }
            .name-display-area > div { display: inline !important; }
            .name-display-area > div:nth-child(2)::before { content: " "; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- パスワード変更モーダル -->
    <div id="password-change-modal" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 hidden">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        const db = getFirestore(initializeApp({ apiKey: "YOUR_API_KEY", projectId: "juku-kanri-system", storageBucket: "juku-kanri-system.firebasestorage.app", messagingSenderId: "525148833125", appId: "1:525148833125:web:36bee786e3545bd7908d8c" }));
        let cachedData = []; let trialsData = []; let courseDates = { start: '', end: '', password: 'koji1516' };
        let openNewMakeupIds = {};
        let openSummerIds = {};
        
        const timeSlots = ["17:00～", "18:10～", "19:20～", "20:30～", "13:40～", "14:50～", "16:00～", "17:30～", "18:40～", "19:50～", "10:00～", "11:10～", "13:00～", "14:10～", "15:20～"];
        const summerTimeSlots = ["10:00～", "11:10～", "13:00～", "14:10～", "15:20～", "17:00～", "18:10～", "19:20～", "20:30～"];
        const subjects = ["算数", "数学", "英語", "国語", "理科", "社会", "数OL", "英OL", "理OL", "数学OL", "英語OL", "理科OL"];
        const timeOptions = timeSlots.map(t => `<option>${t}</option>`).join('');
        const subjectOptions = subjects.map(sub => `<option>${sub}</option>`).join('');

        const famContainer = document.getElementById('fam-container');
        for(let i=1; i<=4; i++) {
            famContainer.innerHTML += `<div class="p-2 border rounded bg-slate-50"><input type="text" id="fam-name${i}" placeholder="氏名" class="input-styled mb-1"><input type="text" id="fam-kana${i}" placeholder="フリガナ" class="input-styled mb-1"><input type="text" id="fam-rel${i}" placeholder="続柄" class="input-styled mb-1"><input type="text" id="fam-birth${i}" placeholder="生年月日" class="input-styled mb-1" onfocus="(this.type='date')" onblur="(this.type='text')" onchange="document.getElementById('fam-grade${i}').innerText = window.calcGrade(this.value)"><div class="flex items-center gap-1 border-2 border-slate-300 rounded bg-white px-2"><span class="text-xs text-slate-500 font-bold whitespace-nowrap"><span id="fam-grade${i}">-</span></span><input type="text" id="fam-work${i}" placeholder="勤務先/学校名" class="flex-1 p-1 outline-none text-sm"></div></div>`;
        }
        
        const getTimeKey = (str) => { 
            const m = str.match(/(\d{1,2}):(\d{2})/); 
            return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : 0; 
        };
        const getColor = (t) => { 
            const cleanT = t.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, '');
            const colors = {'17:00': '#fee2e2', '18:10': '#fef3c7', '19:20': '#dcfce7', '20:30': '#dbeafe', '13:40': '#f1f5f9', '14:50': '#f3e8ff', '16:00': '#ffe4e6', '17:30': '#fef9c3', '18:40': '#ccfbf1', '19:50': '#e0f2fe'}; 
            return colors[cleanT.substring(0, 5)] || '#fff59d'; 
        };
        const createRow = (d="月", t="17:00～", s="算数") => { const div = document.createElement('div'); div.className = "schedule-row"; div.style.backgroundColor = getColor(t); div.style.padding = "5px"; div.style.borderRadius = "4px"; div.style.marginBottom = "5px"; div.innerHTML = `<select class="day border p-2 text-sm bg-white"><option>月</option><option>火</option><option>水</option><option>木</option><option>金</option><option>土</option></select><select class="time border p-2 text-sm bg-white" onchange="this.parentElement.style.backgroundColor = getColor(this.value)">${timeOptions}</select><select class="sub border p-2 text-sm bg-white">${subjectOptions}</select>`; div.querySelector('.day').value = d; div.querySelector('.time').value = t; div.querySelector('.sub').value = s; return div; };
        
        window.calcGrade = (birthDate) => {
            if (!birthDate) return "-";
            const birth = new Date(birthDate);
            if (isNaN(birth.getTime())) return "-";
            const today = new Date();
            const schoolYear = today.getMonth() >= 3 ? today.getFullYear() : today.getFullYear() - 1;
            let entranceYear = birth.getFullYear() + 6;
            if (birth.getMonth() > 3 || (birth.getMonth() === 3 && birth.getDate() >= 2)) entranceYear++;
            const grade = schoolYear - entranceYear + 1;
            if (grade >= 1 && grade <= 6) return `小${grade}`;
            if (grade >= 7 && grade <= 9) return `中${grade - 6}`;
            if (grade >= 10 && grade <= 12) return `高${grade - 9}`;
            return "既卒";
        };

            }

            let events = [];
            const dayOfWeekNames = ["日", "月", "火", "水", "木", "金", "土"];
            const attendanceMap = s.attendance || {};

            try {
                const { jsPDF } = window.jspdf;
                const canvas = await html2canvas(target, { 
                    scale: 2, 
                    useCORS: true,
                    windowWidth: 1400 
                });
                const imgData = canvas.toDataURL('image/png');
                
                const pdf = new jsPDF('p', 'mm', [257, 380]);
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                
                const imgWidth = pageWidth;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                
                pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, Math.min(imgHeight, pageHeight));
                pdf.save('weekly_schedule_b4.pdf');
            } catch (err) {

            container.innerHTML = `
                <select class="border p-1 text-xs bg-white rounded time-select">${timeOptions}</select>
                <button onclick="applyTimeChange('${id}', '${attKey}', '${currentTime}', ${isSummer}, ${isMakeup}, ${isTrial}, this)" class="bg-blue-600 text-white px-2 py-1 rounded text-xs font-bold">変更</button>
            `;
            container.querySelector('.time-select').value = currentTime;
            parent.appendChild(container);
        };

        window.applyTimeChange = async (id, attKey, oldTime, isSummer, isMakeup, isTrial, btn) => {
            const container = btn.parentElement;
            const newTime = container.querySelector('.time-select').value;
            if (!newTime || newTime === oldTime) {
                container.remove();
                return;
            }

            if (isTrial) {
                const t = trialsData.find(item => item.id === id);
                if (t) {
                    t.time = newTime;
                    await updateDoc(doc(db, "trials", id), { time: newTime });
                }
            } else {
                const s = cachedData.find(item => item.id === id);
                if (s) {
                    if (isSummer) {
                        const parts = attKey.split('_');
                        const smDate = parts[1];
                        const smTime = parts[2];
                        if (s.summerSessions) {
                            s.summerSessions = s.summerSessions.map(sess => (sess.date === smDate && sess.time === smTime) ? { ...sess, time: newTime } : sess);
                            await updateDoc(doc(db, "students", id), { summerSessions: s.summerSessions });
                        }
                    } else if (attKey.startsWith('makeup_')) {
                        const parts = attKey.replace(`makeup_${id}_`, '').split('_');
                        const resDate = parts.slice(0, -1).join('_');
                        const resTime = parts[parts.length - 1];
                        if (s.makeupReservations) {
                            s.makeupReservations = s.makeupReservations.map(r => (r.date === resDate && r.time === resTime) ? { ...r, time: newTime } : r);
                            await updateDoc(doc(db, "students", id), { makeupReservations: s.makeupReservations });
                        }
                    } else {
                        if (!s.timeChanges) s.timeChanges = {};
                        s.timeChanges[attKey] = newTime;
                        await updateDoc(doc(db, "students", id), { timeChanges: s.timeChanges });
                    }
                }
            }
            alert("時間を変更しました");
            render();
        };

        const render = () => { 
            const todayStr = document.getElementById('cal-today').value; 
            const dayStr = ["日", "月", "火", "水", "木", "金", "土"][new Date(todayStr).getDay()]; 
            const studentList = document.getElementById('student-list'); 
            const todayList = document.getElementById('today-list'); 
            const newMakeupList = document.getElementById('new-makeup-list'); 
            const trialList = document.getElementById('trial-list');
            const searchBox = document.getElementById('search-box'); 
            const rangeStudent = document.getElementById('range-student');
            const summerContainer = document.getElementById('summer-container');
            
            studentList.innerHTML = ""; todayList.innerHTML = ""; trialList.innerHTML = ""; 
            summerContainer.innerHTML = `
                <div class="bg-slate-100 p-3 rounded-lg mb-4">
                    <h2 class="font-bold text-sm mb-2">講習期間設定</h2>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="course-start" class="input-styled !p-1 text-sm" value="${courseDates.start || ''}">
                        <input type="date" id="course-end" class="input-styled !p-1 text-sm" value="${courseDates.end || ''}">
                    </div>
                    <button onclick="saveCourseDates()" class="mt-2 w-full bg-slate-600 text-white py-1 rounded text-xs font-bold">期間を保存</button>
                </div>
                <div class="font-bold text-lg p-2 bg-slate-100 rounded-t">講習管理</div>
            `;
            newMakeupList.innerHTML = "<div class='font-bold text-lg p-2 bg-slate-100 rounded-t'>振替予約一覧</div>"; 
            searchBox.innerHTML = '<option value="">名前を選択してください...</option>'; 
            const currentSelectedRangeStudent = rangeStudent.value;
            rangeStudent.innerHTML = '<option value="">生徒を選択...</option>';
            
            let timeGroups = {}; 
            
            cachedData.forEach((s, index) => { 
                searchBox.innerHTML += `<option value="${s.id}">${s.name}</option>`;
                rangeStudent.innerHTML += `<option value="${s.id}" ${s.id === currentSelectedRangeStudent ? 'selected' : ''}>${s.name}</option>`;
                
                let summerGroupDiv = document.createElement('div');
                summerGroupDiv.className = "makeup-group";
                let isSummerOpen = !!openSummerIds[s.id];
                summerGroupDiv.innerHTML = `<div class="makeup-name-header" onclick="toggleSummerGroup('${s.id}')"><span>${s.name}</span><span class="text-xs text-blue-600 bg-white px-2 py-0.5 rounded-full border border-blue-200">${(s.summerSessions||[]).length}コマ ${isSummerOpen ? '▲' : '▼'}</span></div><div class="p-3 bg-white ${isSummerOpen ? '' : 'hidden'}" id="sm-${s.id}"></div>`;
                const container = summerGroupDiv.querySelector(`#sm-${s.id}`);
                
                if((s.summerSessions || []).length === 0) {
                    container.innerHTML += `<div class="sm-row"><input type="date" class="input-styled sm-input s-date"><select class="input-styled sm-input s-time">${summerTimeSlots.map(t=>`<option>${t}</option>`).join('')}</select><select class="input-styled sm-input s-sub">${subjects.map(sub=>`<option>${sub}</option>`).join('')}</select></div>`;
                } else {
                    (s.summerSessions || []).forEach((sess) => {
                        container.innerHTML += `<div class="sm-row"><input type="date" value="${sess.date}" class="input-styled sm-input s-date"><select class="input-styled sm-input s-time">${summerTimeSlots.map(t=>`<option ${sess.time===t?'selected':''}>${t}</option>`).join('')}</select><select class="input-styled sm-input s-sub">${subjects.map(sub=>`<option ${sess.sub===sub?'selected':''}>${sub}</option>`).join('')}</select></div>`;
                        
                        if (sess.date === todayStr) {
                            let tKey = sess.time;
                            if (!timeGroups[tKey]) timeGroups[tKey] = { title: tKey + "の予定", events: [], timeVal: getTimeKey(tKey) };
                            timeGroups[tKey].events.push({name: s.name, id: s.id, time: sess.time, sub: sess.sub + " 講習", attKey: `sm_${sess.date}_${sess.time}`, status: (s.attendance || {})[`sm_${sess.date}_${sess.time}`], isSummer: true});
                        }
                    });
                }
                container.innerHTML += `<div class="mt-3 flex gap-2 justify-end"><button onclick="addSummerRow('${s.id}')" class="text-xs bg-slate-500 text-white px-3 py-1.5 rounded">＋行</button><button onclick="saveSummer('${s.id}')" class="bg-blue-600 text-white px-4 py-1.5 rounded text-xs font-bold">保存</button></div>`;
                summerContainer.appendChild(summerGroupDiv);

                const regularAbsences = Object.keys(s.attendance || {}).filter(k => s.attendance[k] === '欠席' && !k.startsWith('makeup_') && !k.startsWith('sm_')).sort((a, b) => {
                    const dateA = a.split('_')[0] || '';
                    const dateB = b.split('_')[0] || '';
                    if (dateA !== dateB) return dateA.localeCompare(dateB);
                    const timeA = a.substring(dateA.length + 1);
                    const timeB = b.substring(dateB.length + 1);
                    return getTimeKey(timeA) - getTimeKey(timeB);
                });

                const summerAbsences = Object.keys(s.attendance || {}).filter(k => s.attendance[k] === '欠席' && k.startsWith('sm_')).sort((a, b) => {
                    const partsA = a.split('_');
                    const partsB = b.split('_');
                    const dateA = partsA[1] || '';
                    const dateB = partsB[1] || '';
                    if (dateA !== dateB) return dateA.localeCompare(dateB);
                    const timeA = partsA[2] || '';
                    const timeB = partsB[2] || '';
                    return getTimeKey(timeA) - getTimeKey(timeB);
                });

                const allAbsences = [...regularAbsences, ...summerAbsences];
                const activeReservations = (s.makeupReservations || []).filter(r => !r.completed);
                
                const remaining = allAbsences.filter(k => !activeReservations.some(r => r.absKey === k)).length;

                let schedHtml = (s.schedules || []).map(sc => `<span class="text-[10px] px-2 py-0.5 rounded whitespace-nowrap inline-block" style="background:${getColor(sc.time)}">${sc.time.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, '')}:${sc.sub}</span>`).join('');
                
                let rawListName = s.name || '';
                let namePartsList = rawListName.trim().split(/[\s ]+/);
                let nameHtmlList = '';
                if (namePartsList.length >= 2) {
                    nameHtmlList = `<span class="name-display-area"><span>${namePartsList[0]}</span><span> </span><span>${namePartsList.slice(1).join(' ')}</span></span>`;
                } else {
                    nameHtmlList = `<span>${rawListName}</span>`;
                }

                studentList.innerHTML += `<div class="student-row"><span class="font-bold text-slate-400 text-sm">${index + 1}.</span><div class="student-main-info"><span onclick="window.editMode('${s.id}')" class="cursor-pointer font-bold text-blue-600 underline">${nameHtmlList}</span><span class="text-xs text-slate-500">${s.grade || ''}</span></div><span class="rem-count ${remaining === 0 ? 'rem-zero' : 'rem-positive'}">振替:${remaining}</span><div class="student-schedules">${schedHtml}</div></div>`;
                
                (s.schedules || []).filter(sc => sc.day === dayStr).forEach(sc => { 
                    let origAttKey = `${todayStr}_${sc.time}`;
                    let tKey = (s.timeChanges && s.timeChanges[origAttKey]) ? s.timeChanges[origAttKey] : sc.time;
                    let attKey = origAttKey;
                    if (!timeGroups[tKey]) timeGroups[tKey] = { title: tKey.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, '') + "の予定", events: [], timeVal: getTimeKey(tKey) };
                    timeGroups[tKey].events.push({name: s.name, id: s.id, time: tKey, sub: sc.sub, attKey: attKey, status: (s.attendance || {})[attKey]}); 
                });

                (s.makeupReservations || []).filter(r => !r.completed && r.date === todayStr).forEach(r => {
                    let tKey = r.time;
                    if (!timeGroups[tKey]) timeGroups[tKey] = { title: tKey.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, '') + "の予定", events: [], timeVal: getTimeKey(tKey) };
                    
                    let origSub = r.subject || "算数";
                    if (!r.subject && r.absKey) {
                        const absTime = r.absKey.split('_')[1];
                        const origSc = (s.schedules || []).find(sc => sc.time === absTime);
                        if (origSc) origSub = origSc.sub;
                    }

                    timeGroups[tKey].events.push({
                        name: s.name, 
                        id: s.id, 
                        time: r.time, 
                        sub: origSub + " 振替", 
                        attKey: `makeup_${s.id}_${r.date}_${r.time}`, 
                        absKey: r.absKey, 
                        makeup: true, 
                        status: (s.attendance || {})[`makeup_${s.id}_${r.date}_${r.time}`]
                    });
                });
                
                const displayableAbsences = allAbsences.filter(k => {
                    const res = activeReservations.find(r => r.absKey === k);
                    if (!res) return true;
                    const makeupAttKey = `makeup_${s.id}_${res.date}_${res.time}`;
                    return (s.attendance || {})[makeupAttKey] !== '出席';
                });

                const displayableReservations = activeReservations.filter(r => {
                    const makeupAttKey = `makeup_${s.id}_${r.date}_${r.time}`;
                    return (s.attendance || {})[makeupAttKey] !== '出席';
                });

                const renderAbsenceRows = (containerEl, isNewTab = false) => {
                    let displayedKeys = new Set([...displayableAbsences, ...displayableReservations.map(r => r.absKey).filter(Boolean)]);

                    Array.from(displayedKeys).forEach(k => { 
                        const res = activeReservations.find(r => r.absKey === k);
                        
                        if (res) {
                            const makeupAttKey = `makeup_${s.id}_${res.date}_${res.time}`;
                            if ((s.attendance || {})[makeupAttKey] === '出席') return;
                        }

                        let defaultSub = "算数";
                        if (k.startsWith('sm_')) {
                            const parts = k.split('_');
                            const smDate = parts[1] || '';
                            const smTime = parts[2] || '';
                            const foundSess = (s.summerSessions || []).find(sess => sess.date === smDate && sess.time === smTime);
                            if (foundSess) defaultSub = foundSess.sub;
                        } else if (k.includes('_')) {
                            const parts = k.split('_');
                            const absDate = parts[0] || '';
                            const absTime = parts[1] || '';
                            const absDayOfWeek = ["日", "月", "火", "水", "木", "金", "土"][new Date(absDate.replace(/-/g, '/')).getDay()];
                            const origSc = (s.schedules || []).find(sc => sc.time === absTime && sc.day === absDayOfWeek) || (s.schedules || []).find(sc => sc.time === absTime);
                            if(origSc) defaultSub = origSc.sub;
                        }

                        let displayOrigText = "";
                        if (k.startsWith('sm_')) {
                            const parts = k.split('_');
                            const smDate = parts[1] || '';
                            const smTime = parts[2] || '';
                            const smCleanTime = smTime.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, '');
                            const smDayOfWeek = ["日", "月", "火", "水", "木", "金", "土"][new Date(smDate.replace(/-/g, '/')).getDay()];
                            displayOrigText = `${smDate.replace(/-/g, '/')} (${smDayOfWeek}) ${smCleanTime} [${defaultSub} 講習]`;
                        } else if (k.includes('_')) {
                            const parts = k.split('_');
                            const absDate = parts[0] || '';
                            const absTime = parts[1] || '';
                            const absCleanTime = absTime.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, '');
                            const absDayOfWeek = ["日", "月", "火", "水", "木", "金", "土"][new Date(absDate.replace(/-/g, '/')).getDay()];
                            displayOrigText = `${absDate.replace(/-/g, '/')} (${absDayOfWeek}) ${absCleanTime} [${defaultSub}]`;
                        } else {
                            displayOrigText = `振替元データ (${k})`;
                        }

                        let resDisplay = "";
                        if (res) {
                            const resDate = res.date.replace(/-/g, '/');
                            const resDayOfWeek = ["日", "月", "火", "水", "木", "金", "土"][new Date(res.date.replace(/-/g, '/')).getDay()];
                            const resCleanTime = res.time.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, '');
                            const resSub = res.subject || defaultSub;
                            resDisplay = `${resDate} (${resDayOfWeek}) ${resCleanTime} [${resSub}]`;
                        }

                        const prefix = isNewTab ? 'new-' : '';
                        const safeKey = prefix + s.id + '-' + k.replace(/[^a-zA-Z0-9-_]/g, '_');

                        containerEl.innerHTML += `<div class="makeup-row"><div class="makeup-orig">${displayOrigText}</div>` + 
                        (res ? `<div class="makeup-inputs justify-center text-blue-600">${resDisplay}</div><button onclick="cancelMakeup('${s.id}','${k}')" class="cancel-btn">取消</button><button onclick="deleteMakeupReservation('${s.id}','${k}')" class="delete-makeup-btn">削除</button>` : 
                        `<div class="makeup-inputs"><input type="date" id="d-${safeKey}" class="input-styled" style="padding:4px; min-height:auto;"><select id="t-${safeKey}">${timeOptions}</select><select id="sub-${safeKey}">${subjects.map(sub => `<option ${sub === defaultSub ? 'selected' : ''}>${sub}</option>`).join('')}</select></div><button onclick="bookMakeupCustom('${s.id}','${k}', ${isNewTab})" class="makeup-btn">予約</button><div></div>`) + `</div>`; 
                    });
                };

                if (displayableAbsences.length > 0 || displayableReservations.length > 0) {
                    // 新タブ (振替)
                    let newGroupDiv = document.createElement('div');
                    newGroupDiv.className = "makeup-group";
                    let isNewMakeupOpen = !!openNewMakeupIds[s.id];
                    newGroupDiv.innerHTML = `<div class="makeup-name-header" onclick="toggleNewMakeupGroup('${s.id}')"><span>${s.name}</span><span>振替残: ${remaining} ${isNewMakeupOpen ? '▲' : '▼'}</span></div><div class="${isNewMakeupOpen ? '' : 'hidden'}" id="new-makeup-body-${s.id}"></div>`;
                    let newBodyContainer = newGroupDiv.querySelector(`#new-makeup-body-${s.id}`);
                    renderAbsenceRows(newBodyContainer, true);
                    newMakeupList.appendChild(newGroupDiv);
                }
            }); 
            
            trialsData.forEach(t => {
                if(!t.registered) {
                    trialList.innerHTML += `<div class="p-2 border rounded flex justify-between items-center text-sm"><div><strong>${t.name}</strong> ${[t.grade, t.sub].filter(Boolean).join(" ")}<br>${t.date} ${t.time.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, '')}</div><div class="flex gap-1"><button onclick="window.convertTrial({id:'${t.id}', name:'${t.name}', grade:'${t.grade}'})" class="bg-blue-600 text-white px-2 py-1 rounded">入塾へ</button><button onclick="window.deleteTrial('${t.id}')" class="bg-red-500 text-white px-2 py-1 rounded">取消</button></div></div>`;
                }
                if(t.date === todayStr) {
                    let tKey = t.time;
                    if (!timeGroups[tKey]) timeGroups[tKey] = { title: tKey.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, '') + "の予定", events: [], timeVal: getTimeKey(tKey) };
                    timeGroups[tKey].events.push({name: t.name + " (体験)", id: t.id, isTrial: true, time: t.time, sub: [t.grade, t.sub].filter(Boolean).join(" ") || "体験", attKey: `trial_${t.id}`, status: (t.attendance || {})[`trial_${t.id}`]});
                }
            });

            setTimeout(() => {
                const sortGroups = (listContainer) => {
                    const groups = listContainer.querySelectorAll('.makeup-group');
                    groups.forEach(group => {
                        const bodyContainer = group.querySelector(`[id$="body-"]`);
                        if (!bodyContainer) return;
                        const rows = Array.from(bodyContainer.querySelectorAll('.makeup-row'));
                        rows.sort((a, b) => {
                            const textA = a.querySelector('.makeup-orig').textContent.trim();
                            const textB = b.querySelector('.makeup-orig').textContent.trim();
                            const partsA = textA.split(' ');
                            const partsB = textB.split(' ');
                            const dateA = partsA[0] || '';
                            const dateB = partsB[0] || '';
                            if (dateA !== dateB) return dateA.localeCompare(dateB);
                            const timeA = partsA[2] || '';
                            const timeB = partsB[2] || '';
                            return getTimeKey(timeA) - getTimeKey(timeB);
                        });
                        rows.forEach(row => bodyContainer.appendChild(row));
                    });
                };
                sortGroups(newMakeupList);
            }, 0);

            Object.keys(timeGroups).sort((a,b) => timeGroups[a].timeVal - timeGroups[b].timeVal).forEach(k => {
                todayList.innerHTML += `<div class="font-bold text-slate-700 mt-6 mb-2 border-b border-slate-300" style="max-width: 600px; margin: 12px auto 4px auto;">${timeGroups[k].title}</div>`;
                
                timeGroups[k].events.sort((a, b) => {
                    const aIsOL = a.sub.includes('OL');
                    const bIsOL = b.sub.includes('OL');
                    if (aIsOL === bIsOL) return 0;
                    return aIsOL ? 1 : -1;
                });

                timeGroups[k].events.forEach(ev => {
                    let rawName = ev.name.replace(/\s*\(体験\)$/, '');
                    let suffix = ev.name.includes('(体験)') ? ' (体験)' : '';
                    let nameParts = rawName.trim().split(/[\s ]+/);
                    let nameHtml = '';
                    if (nameParts.length >= 2) {
                        nameHtml = `<div class="name-display-area"><div>${nameParts[0]}</div><div>${nameParts.slice(1).join(' ')}</div></div>${suffix}`;
                    } else {
                        nameHtml = `${rawName}${suffix}`;
                    }

                    let subHtml = ev.sub;
                    if (subHtml.includes(' 振替')) {
                        subHtml = subHtml.replace(' 振替', '<br><span class="text-[11px] font-bold text-red-600">振替</span>');
                    } else if (subHtml.includes(' 講習')) {
                        subHtml = subHtml.replace(' 講習', '<br><span class="text-[11px] font-bold text-blue-600">講習</span>');
                    } else {
                        subHtml = subHtml.replace(/([^\s]+)\s*(\([^\)]+\))/, '$1<br><span class="text-[11px] font-normal text-slate-600">$2</span>');
                    }

                    todayList.innerHTML += `
                        <div class="grid-row" style="background:${ev.isSummer ? '#fff59d' : getColor(ev.time)}">
                            <div class="min-w-0 flex flex-col justify-center">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <strong class="text-sm truncate shrink-0 max-w-[180px]">${nameHtml}</strong>
                                </div>
                            </div>
                            <span class="text-xs md:text-sm font-medium leading-tight" style="word-break:break-word;">${subHtml}</span>
                            <div class="flex gap-1 shrink-0 items-center">
                                <button onclick="setAtt('${ev.id}','${ev.attKey}','出席','${ev.absKey || ''}', ${!!ev.isTrial || false})" class="att-btn ${ev.status === '出席' ? 'bg-blue-500 text-white' : ''}">出</button>
                                <button onclick="setAtt('${ev.id}','${ev.attKey}','欠席','${ev.absKey || ''}', ${!!ev.isTrial || false})" class="att-btn ${ev.status === '欠席' ? 'bg-red-500 text-white' : ''}">欠</button>
                                <button onclick="setAtt('${ev.id}','${ev.attKey}','無','${ev.absKey || ''}', ${!!ev.isTrial || false})" class="att-btn ${ev.status === '無' ? 'bg-slate-500 text-white' : ''}">無</button>
                                <button onclick="setAtt('${ev.id}','${ev.attKey}','取消','${ev.absKey || ''}', ${!!ev.isTrial || false})" class="att-btn">取</button>
                                <button onclick="toggleTimeChangeUI(this, '${ev.id}', '${ev.attKey}', '${ev.time}', ${!!ev.isSummer}, ${!!ev.makeup}, ${!!ev.isTrial})" class="att-btn bg-amber-100 hover:bg-amber-200 text-amber-800">変</button>
                            </div>
                        </div>`;
                });
            });
        }; 

        window.setAtt = async (id, attKey, status, absKey='', isTrial=false) => { 
            if (isTrial) {
                const targetTrial = trialsData.find(t => t.id === id);
                if (targetTrial) {
                    if (!targetTrial.attendance) targetTrial.attendance = {};
                    if (status === '取消') {
                        delete targetTrial.attendance[attKey];
                    } else {
                        targetTrial.attendance[attKey] = status;
                    }
                }
            } else {
                const targetStudent = cachedData.find(s => s.id === id);
                if (targetStudent) {
                    if (!targetStudent.attendance) targetStudent.attendance = {};
                    if (!targetStudent.makeupReservations) targetStudent.makeupReservations = [];

                    if (status === '取消') {
                        delete targetStudent.attendance[attKey];
                        targetStudent.makeupReservations = targetStudent.makeupReservations.filter(r => r.absKey !== attKey);
                    } else if (status === '出席') { 
                        targetStudent.attendance[attKey] = '出席'; 
                        if (attKey.startsWith('makeup_')) {
                            const parts = attKey.replace(`makeup_${id}_`, '').split('_');
                            const resDate = parts.slice(0, -1).join('_');
                            const resTime = parts[parts.length - 1];
                            const matchedRes = targetStudent.makeupReservations.find(r => r.date === resDate && r.time === resTime);
                            
                            const targetAbsKey = absKey || (matchedRes ? matchedRes.absKey : '');
                            if (targetAbsKey) {
                                targetStudent.attendance[targetAbsKey] = '無';
                            }
                            targetStudent.makeupReservations = targetStudent.makeupReservations.map(r => 
                                (r.absKey === targetAbsKey || (r.date === resDate && r.time === resTime)) ? { ...r, completed: true } : r
                            );
                        }
                    } else {
                        targetStudent.attendance[attKey] = status;
                        if (attKey.startsWith('makeup_') && status === '欠席') {
                            const parts = attKey.replace(`makeup_${id}_`, '').split('_');
                            const resDate = parts.slice(0, -1).join('_');
                            const resTime = parts[parts.length - 1];
                            targetStudent.makeupReservations = targetStudent.makeupReservations.map(r => (r.date === resDate && r.time === resTime) ? { ...r, completed: false } : r);
                            if (absKey) {
                                targetStudent.makeupReservations = targetStudent.makeupReservations.map(r => r.absKey === absKey ? { ...r, completed: false } : r);
                            }
                        }
                    }
                }
            }
            render();

            const ref = doc(db, isTrial ? "trials" : "students", id);

            if (status === '取消') {
                delete attendance[attKey];
                if (!isTrial) {
                    reservations = reservations.filter(r => r.absKey !== attKey);
                }
            } else if (status === '出席') { 
                attendance[attKey] = '出席'; 
                if (attKey.startsWith('makeup_')) {
                    const parts = attKey.replace(`makeup_${id}_`, '').split('_');
                    const resDate = parts.slice(0, -1).join('_');
                    const resTime = parts[parts.length - 1];
                    const matchedRes = reservations.find(r => r.date === resDate && r.time === resTime);
                    
                    const targetAbsKey = absKey || (matchedRes ? matchedRes.absKey : '');
                    if (targetAbsKey) {
                        attendance[targetAbsKey] = '無';
                    }
                    reservations = reservations.map(r => 
                        (r.absKey === targetAbsKey || (r.date === resDate && r.time === resTime)) ? { ...r, completed: true } : r
                    );

                    if (absKey) {
                        reservations = reservations.map(r => r.absKey === absKey ? { ...r, completed: false } : r);
                    }
                }
            }
            
            await updateDoc(ref, { attendance, ...(isTrial ? {} : { makeupReservations: reservations }) });
