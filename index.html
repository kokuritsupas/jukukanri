<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>塾管理システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://yubinbango.github.io/yubinbango/yubinbango.js" charset="UTF-8"></script>
    <!-- jsPDF の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- html2canvas の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; overflow-x:hidden; touch-action: manipulation; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-btn { flex: 1; padding: 12px 2px; font-weight: bold; font-size: 12px; transition: all 0.2s; white-space: nowrap; border-bottom: 3px solid transparent; text-align: center; }
        
        #nav1 { background: #b3d7ff !important; color: #4a5568; border-bottom-color: #80bfff; }
        #nav2 { background: #ffeaa7 !important; color: #4a5568; border-bottom-color: #ffe066; }
        #nav3 { background: #b2f2bb !important; color: #4a5568; border-bottom-color: #8ce99a; }
        #nav4 { background: #ffc9c9 !important; color: #4a5568; border-bottom-color: #ffa8a8; }
        #nav5 { background: #eebefa !important; color: #4a5568; border-bottom-color: #d896ff; }
        #nav6 { background: #f1f3f5 !important; color: #4a5568; border-bottom-color: #ced4da; }
        #nav7 { background: #fff59d !important; color: #4a5568; border-bottom-color: #fdd835; }
        
        .nav-btn:not(.nav-active-tab) { background: #f8fafc !important; color: #64748b !important; border-bottom-color: transparent !important; }
        .btn-main { background-color: #3b82f6; color: white; padding: 16px; border-radius: 8px; font-weight: bold; width: 100%; }
        .input-styled { border: 2px solid #cbd5e1; padding: 10px; border-radius: 6px; width: 100%; background: #f8fafc; color: #000000; font-weight: 500; box-sizing: border-box; -webkit-appearance: none; display: block; font-size: 14px; min-height: 44px; }
        .grade-box { border: 2px solid #cbd5e1; padding: 10px; border-radius: 6px; width: 100%; background: #f8fafc; font-size: 16px; box-sizing: border-box; }
        .grade-value { color: #000000; font-weight: 500; }
        
        .grid-row { display: grid; grid-template-columns: 1fr 1fr auto; align-items: center; gap: 10px; padding: 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: white; max-width: 600px; margin: 0 auto; }
        .att-btn { border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 6px; font-size: 14px; font-weight: bold; }
        
        .student-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid #e2e8f0; background: white; }
        .student-main-info { display: flex; align-items: baseline; gap: 6px; }
        .student-schedules { grid-column: 1 / span 3; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
        
        .rem-count { font-weight: bold; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
        .rem-positive { color: #ef4444; border: 1px solid #ef4444; }
        .rem-zero { background: #cbd5e1; color: white; }
        
        .makeup-container { padding: 10px; }
        .makeup-group { margin-bottom: 16px; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
        .makeup-name-header { background: #f1f5f9; padding: 8px; font-weight: bold; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; cursor: pointer; }
        .makeup-row { display: grid; grid-template-columns: 1.4fr 1.5fr auto; align-items: center; gap: 6px; padding: 8px; border-bottom: 1px solid #f1f5f9; background: white; font-size: 12px; }
        .makeup-orig { color: #475569; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .makeup-inputs { display: flex; gap: 2px; }
        .makeup-inputs input, .makeup-inputs select { width: 100%; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 11px; }
        .makeup-btn { padding: 6px 10px; background: #3b82f6; color: white; border-radius: 4px; font-weight: bold; font-size: 11px; white-space: nowrap; text-align: center; }
        .cancel-btn { padding: 6px 10px; background: #ef4444; color: white; border-radius: 4px; font-weight: bold; font-size: 11px; white-space: nowrap; text-align: center; }

        .sm-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-bottom: 4px; align-items: center; }
        .sm-input { height: 36px !important; font-size: 12px !important; padding: 2px !important; }
        
        @media print {
            body * { visibility: hidden; }
            #range-result-area, #range-result-area * { visibility: visible; }
            #range-result-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }

        @media (min-width: 768px) {
            .max-w-xl { max-width: 1100px !important; display: grid !important; grid-template-columns: 200px 1fr; gap: 20px; align-items: start; }
            nav { flex-direction: column !important; border-bottom: none !important; background: #f1f5f9 !important; border-radius: 8px; }
            .nav-btn { text-align: center; border-bottom: none !important; border-left: 4px solid transparent !important; }
            
            .name-display-area { display: inline !important; }
            .name-display-area > div { display: inline !important; }
            .name-display-area > div:nth-child(2)::before { content: " "; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- パスワード認証モーダル -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm space-y-4">
            <h2 class="text-lg font-bold text-slate-800 border-l-4 border-blue-600 pl-3">パスワード認証</h2>
            <p class="text-xs text-slate-600">システムを利用するにはパスワードを入力してください。</p>
            <input type="password" id="auth-password" placeholder="パスワードを入力" class="input-styled">
            <button id="auth-btn" class="btn-main">ログイン</button>
            <div id="auth-error" class="text-xs text-red-500 font-bold text-center hidden">パスワードが間違っています</div>
        </div>
    </div>

    <div class="max-w-xl mx-auto bg-white min-h-screen shadow-2xl p-4 h-adr">
        <span class="p-country-name" style="display:none;">Japan</span>
        <div>
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-bold border-l-4 border-slate-800 pl-3 m-0">塾管理システム</h1>
                <button onclick="openPasswordChangeModal()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded font-bold">パスワード変更</button>
            </div>
            <nav class="flex border-b mb-6 overflow-hidden bg-slate-100 rounded-t-lg">
                <button id="nav1" class="nav-btn nav-active-tab">登録編集</button>
                <button id="nav2" class="nav-btn">一覧</button>
                <button id="nav3" class="nav-btn">予定</button>
                <button id="nav4" class="nav-btn">振替</button>
                <button id="nav5" class="nav-btn">詳細</button>
                <button id="nav6" class="nav-btn">体験</button>
                <button id="nav7" class="nav-btn">講習管理</button>
            </nav>
        </div>

        <div>
            <div id="tab1" class="tab-content active space-y-4">
                <input type="text" id="stu-id" placeholder="生徒ID（必須）" class="input-styled md:w-1/2 w-full">
                <div class="flex gap-2">
                    <input type="text" id="stu-name" placeholder="氏名" class="input-styled">
                    <input type="text" id="stu-kana" placeholder="フリガナ" class="input-styled">
                </div>
                <div class="flex gap-2">
                    <input type="text" id="stu-birth" class="input-styled" placeholder="生年月日(yyyy/mm/dd)" onfocus="(this.type='date')" onblur="(this.type='text')" onchange="document.getElementById('grade-result').innerText = window.calcGrade(this.value)">
                    <div id="display-grade" class="grade-box flex items-center">
                        <span id="grade-result" class="grade-value">-</span>
                    </div>
                </div>
                <input type="text" id="zip" placeholder="郵便番号" class="input-styled p-postal-code w-1/3" name="zip">
                <input type="text" id="addr" placeholder="住所" class="input-styled p-region p-locality p-street-address" name="addr">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                    <input type="text" id="email" placeholder="メールアドレス" class="input-styled">
                    <input type="text" id="tel1" placeholder="電話番号(メイン)" class="input-styled">
                    <input type="text" id="tel2" placeholder="電話番号(サブ)" class="input-styled">
                </div>
                <div id="fam-container" class="grid grid-cols-1 md:grid-cols-2 gap-2"></div>
                <div id="schedule-container" class="space-y-3 pt-2"></div>
                <button id="add-schedule" class="w-full text-blue-600 border-2 border-blue-600 py-3 rounded font-bold hover:bg-blue-50">+ 授業枠を追加</button>
                <button id="save-btn" class="btn-main">保存する</button>
                <button id="cancel-trial-convert" class="w-full bg-slate-500 text-white py-2 rounded font-bold hidden">体験移行をキャンセル</button>
                <button id="delete-btn" class="w-full bg-red-500 text-white py-2 rounded font-bold hidden hover:bg-red-600">生徒データを削除</button>
                <button id="clear-btn" class="w-full text-slate-400 py-2 underline">新規登録モードへ</button>
            </div>

            <div id="tab2" class="tab-content space-y-4">
                <div class="p-3 bg-slate-100 rounded-lg border space-y-2">
                    <div class="text-xs font-bold text-slate-700">一斉メール送信</div>
                    <input type="text" id="bulk-mail-subject" placeholder="件名" class="input-styled !p-2 text-xs">
                    <textarea id="bulk-mail-body" placeholder="本文を入力してください..." class="input-styled !p-2 text-xs h-24"></textarea>
                    <button onclick="sendBulkMail()" class="w-full bg-blue-600 text-white py-2 rounded text-xs font-bold hover:bg-blue-700">登録済みメールアドレスへ一斉送信 (BCC)</button>
                </div>
                <div id="student-list"></div>
            </div>
            <div id="tab3" class="tab-content space-y-4">
                <div style="max-width: 600px; margin: 0 auto;" class="space-y-2">
                    <input type="date" id="cal-today" class="input-styled font-bold" style="color: #000 !important;">
                    <div class="p-3 bg-slate-100 rounded-lg border space-y-2">
                        <div class="text-xs font-bold text-slate-700">個人別期間スケジュール抽出</div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <select id="range-student" class="input-styled !p-2 text-xs"><option value="">生徒を選択...</option></select>
                            <input type="date" id="range-start" class="input-styled !p-2 text-xs">
                            <input type="date" id="range-end" class="input-styled !p-2 text-xs">
                        </div>
                        <button onclick="extractPersonalRange()" class="w-full bg-slate-700 text-white py-2 rounded text-xs font-bold">抽出する</button>
                    </div>
                    <div id="range-result-area"></div>
                </div>
                <div id="today-list" class="space-y-3 pt-2"></div>
            </div>
            <div id="tab4" class="tab-content makeup-container"><div id="makeup-list" class="space-y-1"></div></div>
            <div id="tab5" class="tab-content space-y-4"><select id="search-box" class="input-styled"><option value="">名前を選択してください...</option></select><div id="detail-view" class="p-4 border rounded bg-slate-50 text-sm">生徒を選択してください</div></div>
            <div id="tab6" class="tab-content space-y-4">
                <h2 class="font-bold border-b pb-2">体験授業一覧</h2>
                <div id="trial-list" class="space-y-2"></div>
                <h2 class="font-bold border-b pb-2 mt-6">新規体験登録</h2>
                <input type="text" id="trial-name" placeholder="氏名" class="input-styled">
                <select id="trial-grade" class="input-styled">
                    <option value="">学年を選択...</option>
                    <option>小1</option><option>小2</option><option>小3</option><option>小4</option><option>小5</option><option>小6</option>
                    <option>中1</option><option>中2</option><option>中3</option>
                    <option>高1</option><option>高2</option><option>高3</option>
                    <option>既卒</option>
                </select>
                <select id="trial-sub" class="input-styled">
                    <option value="">教科を選択...</option>
                    <option>算数</option><option>数学</option><option>英語</option><option>国語</option><option>理科</option><option>社会</option>
                    <option>数学OL</option><option>英語OL</option><option>理科OL</option>
                </select>
                <input type="date" id="trial-date" class="input-styled">
                <select id="trial-time" class="input-styled"><option>①17:00</option><option>②18:10</option><option>③19:20</option><option>④20:30</option><option>⑤13:40</option><option>⑥14:50</option><option>⑦16:00</option><option>⑧17:30</option><option>⑨18:40</option><option>⑩19:50</option></select>
                <button id="save-trial" class="btn-main">体験予約を保存</button>
            </div>
            <div id="tab7" class="tab-content makeup-container"><div id="summer-container" class="space-y-1"></div></div>
        </div>
    </div>

    <!-- パスワード変更モーダル -->
    <div id="password-change-modal" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm space-y-4">
            <h2 class="text-lg font-bold text-slate-800 border-l-4 border-blue-600 pl-3">パスワード変更</h2>
            <input type="password" id="old-password" placeholder="旧パスワード" class="input-styled">
            <input type="password" id="new-password" placeholder="新しいパスワード" class="input-styled">
            <div id="password-change-error" class="text-xs text-red-500 font-bold text-center hidden">旧パスワードが間違っています</div>
            <div class="flex gap-2">
                <button onclick="saveNewPassword()" class="btn-main !p-2">変更を保存</button>
                <button onclick="closePasswordChangeModal()" class="w-full bg-slate-300 text-slate-700 py-2 rounded font-bold">キャンセル</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        const db = getFirestore(initializeApp({ apiKey: "YOUR_API_KEY", projectId: "juku-kanri-system", storageBucket: "juku-kanri-system.firebasestorage.app", messagingSenderId: "525148833125", appId: "1:525148833125:web:36bee786e3545bd7908d8c" }));
        let cachedData = []; let trialsData = []; let courseDates = { start: '', end: '', password: 'koji1516' };
        let openMakeupIds = {};
        let openSummerIds = {};
        
        const timeSlots = ["①17:00", "②18:10", "③19:20", "④20:30", "⑤13:40", "⑥14:50", "⑦16:00", "⑧17:30", "⑨18:40", "⑩19:50", "10:00～", "11:10～", "13:00～", "14:10～", "15:20～"];
        const summerTimeSlots = ["10:00～", "11:10～", "13:00～", "14:10～", "15:20～", "17:00～", "18:10～", "19:20～", "20:30～"];
        const subjects = ["算数", "数学", "英語", "国語", "理科", "社会", "数OL", "英OL", "理OL", "数学OL", "英語OL", "理科OL"];
        const timeOptions = timeSlots.map(t => `<option>${t}</option>`).join('');
        const subjectOptions = subjects.map(sub => `<option>${sub}</option>`).join('');

        const famContainer = document.getElementById('fam-container');
        for(let i=1; i<=4; i++) {
            famContainer.innerHTML += `<div class="p-2 border rounded bg-slate-50"><input type="text" id="fam-name${i}" placeholder="氏名" class="input-styled mb-1"><input type="text" id="fam-kana${i}" placeholder="フリガナ" class="input-styled mb-1"><input type="text" id="fam-rel${i}" placeholder="続柄" class="input-styled mb-1"><input type="text" id="fam-birth${i}" placeholder="生年月日" class="input-styled mb-1" onfocus="(this.type='date')" onblur="(this.type='text')" onchange="document.getElementById('fam-grade${i}').innerText = window.calcGrade(this.value)"><div class="flex items-center gap-1 border-2 border-slate-300 rounded bg-white px-2"><span class="text-xs text-slate-500 font-bold whitespace-nowrap"><span id="fam-grade${i}">-</span></span><input type="text" id="fam-work${i}" placeholder="勤務先/学校名" class="flex-1 p-1 outline-none text-sm"></div></div>`;
        }
        
        const getTimeKey = (str) => { 
            const m = str.match(/(\d{1,2}):(\d{2})/); 
            return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : 0; 
        };
        const getColor = (t) => { const colors = {'①': '#fee2e2', '②': '#fef3c7', '③': '#dcfce7', '④': '#dbeafe', '⑤': '#f1f5f9', '⑥': '#f3e8ff', '⑦': '#ffe4e6', '⑧': '#fef9c3', '⑨': '#ccfbf1', '⑩': '#e0f2fe'}; return colors[t.substring(0,1)] || '#fff59d'; };
        const createRow = (d="月", t="①17:00", s="算数") => { const div = document.createElement('div'); div.className = "schedule-row"; div.style.backgroundColor = getColor(t); div.style.padding = "5px"; div.style.borderRadius = "4px"; div.style.marginBottom = "5px"; div.innerHTML = `<select class="day border p-2 text-sm bg-white"><option>月</option><option>火</option><option>水</option><option>木</option><option>金</option><option>土</option></select><select class="time border p-2 text-sm bg-white" onchange="this.parentElement.style.backgroundColor = getColor(this.value)">${timeOptions}</select><select class="sub border p-2 text-sm bg-white">${subjectOptions}</select>`; div.querySelector('.day').value = d; div.querySelector('.time').value = t; div.querySelector('.sub').value = s; return div; };
        
        window.calcGrade = (birthDate) => {
            if (!birthDate) return "-";
            const birth = new Date(birthDate);
            if (isNaN(birth.getTime())) return "-";
            const today = new Date();
            const schoolYear = today.getMonth() >= 3 ? today.getFullYear() : today.getFullYear() - 1;
            let entranceYear = birth.getFullYear() + 6;
            if (birth.getMonth() > 3 || (birth.getMonth() === 3 && birth.getDate() >= 2)) entranceYear++;
            const grade = schoolYear - entranceYear + 1;
            if (grade >= 1 && grade <= 6) return `小${grade}`;
            if (grade >= 7 && grade <= 9) return `中${grade - 6}`;
            if (grade >= 10 && grade <= 12) return `高${grade - 9}`;
            return "既卒";
        };

        window.deleteTrial = async (id) => {
            if(!confirm("体験予定を取消しますか？")) return;
            await deleteDoc(doc(db, "trials", id));
            location.reload();
        };

        window.convertTrial = async (t) => {
            document.getElementById('stu-id').value = Date.now().toString();
            document.getElementById('stu-name').value = t.name || '';
            document.getElementById('grade-result').innerText = t.grade || '-';
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('nav-active-tab'));
            document.getElementById('tab1').classList.add('active');
            document.getElementById('nav1').classList.add('nav-active-tab');
            window.pendingTrialConversion = t.id;
            alert("登録編集タブへ移動しました。内容を確認して保存してください。");
        };

        window.saveCourseDates = async () => {
            await setDoc(doc(db, "system", "config"), { start: document.getElementById('course-start').value, end: document.getElementById('course-end').value }, {merge:true});
            alert("期間を保存しました");
        };

        window.openPasswordChangeModal = () => {
            document.getElementById('old-password').value = "";
            document.getElementById('new-password').value = "";
            document.getElementById('password-change-error').classList.add('hidden');
            document.getElementById('password-change-modal').classList.remove('hidden');
        };

        window.closePasswordChangeModal = () => {
            document.getElementById('password-change-modal').classList.add('hidden');
        };

        window.saveNewPassword = async () => {
            const oldPass = document.getElementById('old-password').value.trim();
            const newPass = document.getElementById('new-password').value.trim();
            const correctPass = courseDates.password || 'koji1516';
            
            if(!oldPass || !newPass) {
                alert("旧パスワードと新しいパスワードを入力してください");
                return;
            }
            if(oldPass !== correctPass) {
                document.getElementById('password-change-error').classList.remove('hidden');
                return;
            }
            
            document.getElementById('password-change-error').classList.add('hidden');
            await setDoc(doc(db, "system", "config"), { password: newPass }, {merge:true});
            alert("パスワードを変更しました");
            closePasswordChangeModal();
            document.getElementById('old-password').value = "";
            document.getElementById('new-password').value = "";
        };

        document.getElementById('auth-btn').onclick = () => {
            const inputPass = document.getElementById('auth-password').value;
            const correctPass = courseDates.password || 'koji1516';
            if (inputPass === correctPass) {
                document.getElementById('auth-modal').classList.add('hidden');
            } else {
                document.getElementById('auth-error').classList.remove('hidden');
            }
        };

        window.toggleMakeupGroup = (id) => {
            openMakeupIds[id] = !openMakeupIds[id];
            render();
        };

        window.toggleSummerGroup = (id) => {
            openSummerIds[id] = !openSummerIds[id];
            render();
        };

        window.addSummerRow = (id) => {
            const container = document.getElementById(`sm-${id}`);
            const div = document.createElement('div');
            div.className = "sm-row";
            div.innerHTML = `<input type="date" class="input-styled sm-input s-date"><select class="input-styled sm-input s-time">${summerTimeSlots.map(t=>`<option>${t}</option>`).join('')}</select><select class="input-styled sm-input s-sub">${subjects.map(sub=>`<option>${sub}</option>`).join('')}</select>`;
            container.appendChild(div);
        };

        window.saveSummer = async (id) => {
            const container = document.getElementById(`sm-${id}`);
            const rows = Array.from(container.querySelectorAll('.sm-row'));

        window.extractPersonalRange = () => {
            const studentId = document.getElementById('range-student').value;
            const startDateStr = document.getElementById('range-start').value;
            const endDateStr = document.getElementById('range-end').value;
            const resultArea = document.getElementById('range-result-area');

            if (!studentId) {
                alert("生徒を選択してください");
                return;
            }
            if (!startDateStr || !endDateStr) {
                alert("開始日と終了日の両方を指定してください");
                return;
            }

            const s = cachedData.find(item => item.id === studentId);
            if (!s) {
                resultArea.innerHTML = "<div class='p-2 text-xs text-red-500 bg-white border rounded'>生徒データが見つかりません</div>";
                return;
            }

            const startDate = new Date(startDateStr);
            const endDate = new Date(endDateStr);
            if (startDate > endDate) {
                alert("開始日は終了日より前の日付を指定してください");
                return;
            }

            let events = [];
            const dayOfWeekNames = ["日", "月", "火", "水", "木", "金", "土"];
            const attendanceMap = s.attendance || {};

            let curr = new Date(startDate);
            while (curr <= endDate) {
                const yyyy = curr.getFullYear();
                const mm = String(curr.getMonth() + 1).padStart(2, '0');
                const dd = String(curr.getDate()).padStart(2, '0');
                const dateStr = `${yyyy}/${mm}/${dd}`;
                const dashDateStr = `${yyyy}-${mm}-${dd}`;
                const dayOfWeekStr = dayOfWeekNames[curr.getDay()];

                (s.schedules || []).forEach(sc => {
                    if (sc.day === dayOfWeekStr) {
                        const attKey = `${dashDateStr}_${sc.time}`;
                        const status = attendanceMap[attKey];
                        if (status !== '無' && status !== '欠席') {
                            events.push({ date: dateStr, dayOfWeek: dayOfWeekStr, time: sc.time, sub: sc.sub, type: '通常' });
                        }
                    }
                });

                curr.setDate(curr.getDate() + 1);
            }

            (s.summerSessions || []).forEach(sess => {
                if (sess.date) {
                    const sessDate = new Date(sess.date);
                    if (sessDate >= startDate && sessDate <= endDate) {
                        const attKey = `sm_${sess.date}_${sess.time}`;
                        const status = attendanceMap[attKey];
                        if (status !== '無' && status !== '欠席') {
                            const formattedDate = sess.date.replace(/-/g, '/');
                            const sessDayOfWeek = dayOfWeekNames[sessDate.getDay()];
                            events.push({ date: formattedDate, dayOfWeek: sessDayOfWeek, time: sess.time, sub: sess.sub + " (講習)", type: '講習' });
                        }
                    }
                }
            });

            (s.makeupReservations || []).forEach(r => {
                if (!r.completed && r.date) {
                    const rDate = new Date(r.date);
                    if (rDate >= startDate && rDate <= endDate) {
                        const attKey = `makeup_${s.id}_${r.date}_${r.time}`;
                        const status = attendanceMap[attKey];
                        if (status !== '無' && status !== '欠席') {
                            const formattedDate = r.date.replace(/-/g, '/');
                            const rDayOfWeek = dayOfWeekNames[rDate.getDay()];
                            
                            let origSub = r.subject || "算数";
                            if (!r.subject && r.absKey) {
                                const absTime = r.absKey.split('_')[1];
                                const origSc = (s.schedules || []).find(sc => sc.time === absTime);
                                if (origSc) origSub = origSc.sub;
                            }

                            events.push({ date: formattedDate, dayOfWeek: rDayOfWeek, time: r.time, sub: origSub + " (振替)", type: '振替' });
                        }
                    }
                }
            });

            events.sort((a, b) => {
                if (a.date !== b.date) return a.date.localeCompare(b.date);
                return getTimeKey(a.time) - getTimeKey(b.time);
            });

            if (events.length === 0) {
                resultArea.innerHTML = `<div class='p-3 text-xs text-slate-600 bg-white border rounded'>${s.name}さんの指定期間 (${startDateStr} ～ ${endDateStr}) の予定はありません。</div>`;
                return;
            }

            let pages = [];
            for (let i = 0; i < events.length; i += 20) {
                pages.push(events.slice(i, i + 20));
            }

            let html = `
                <div class="no-print flex justify-end gap-2 mb-2">
                    <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded font-bold text-xs">印刷</button>
                    <button onclick="downloadPDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded font-bold text-xs">PDF出力</button>
                    <button onclick="document.getElementById('range-result-area').innerHTML=''" class="bg-slate-300 hover:bg-slate-400 text-slate-800 px-2 py-1 rounded font-bold text-xs">閉じる</button>
                </div>
                <div id="pdf-container-area">
            `;

            pages.forEach((pageEvents, pageIndex) => {
                html += `
                    <div class='pdf-target-page bg-white border rounded shadow-sm overflow-hidden text-xs p-6' style="box-sizing: border-box; width: 210mm; height: 297mm; margin: 0 auto; background: white; display: flex; flex-direction: column; justify-content: space-between; page-break-after: always;">
                        <div>
                            <div class='pb-3 mb-4 border-b-2 border-slate-800 font-bold text-slate-800 flex justify-between items-center text-sm'>
                                <span>${s.name}さんのスケジュール一覧 (${startDateStr} ～ ${endDateStr})</span>
                                <span class='text-slate-500 font-normal text-xs'>全 ${events.length} 件中 (${pageIndex + 1}ページ目 / 全 ${pages.length}ページ)</span>
                            </div>
                            <div class='overflow-x-auto'>
                                <table class='w-full text-left border-collapse border border-slate-300'>
                                    <thead>
                                        <tr class='bg-slate-100 text-slate-700 border-b border-slate-300'>
                                            <th class='p-3 border border-slate-300 text-center font-bold'>日付</th>
                                            <th class='p-3 border border-slate-300 text-center font-bold'>曜日</th>
                                            <th class='p-3 border border-slate-300 text-center font-bold'>時間</th>
                                            <th class='p-3 border border-slate-300 font-bold'>教科</th>
                                            <th class='p-3 border border-slate-300 text-center font-bold'>区分</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                `;

                pageEvents.forEach(ev => {
                    html += `
                        <tr class='border-b border-slate-300 hover:bg-slate-50'>
                            <td class='p-3 border border-slate-300 font-mono text-center whitespace-nowrap'>${ev.date}</td>
                            <td class='p-3 border border-slate-300 text-center whitespace-nowrap'>${ev.dayOfWeek}</td>
                            <td class='p-3 border border-slate-300 text-center whitespace-nowrap'>${ev.time}</td>
                            <td class='p-3 border border-slate-300 font-semibold'>${ev.sub}</td>
                            <td class='p-3 border border-slate-300 text-center whitespace-nowrap'>${ev.type}</td>
                        </tr>
                    `;
                });

                html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="text-center text-slate-400 text-[10px] pt-4 mt-auto">塾管理システム - ${pageIndex + 1} / ${pages.length}</div>
                    </div>
                `;
            });

            html += `</div>`;
            resultArea.innerHTML = html;
        };

        window.downloadPDF = async () => {
            const targets = document.querySelectorAll('.pdf-target-page');
            if (targets.length === 0) return;
            const noPrintElements = document.querySelectorAll('.no-print');
            noPrintElements.forEach(el => el.style.display = 'none');
            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                for (let i = 0; i < targets.length; i++) {
                    const canvas = await html2canvas(targets[i], { scale: 2, useCORS: true, windowWidth: 800 });
                    const imgData = canvas.toDataURL('image/png');
                    
                    if (i > 0) pdf.addPage();
                    
                    pdf.addImage(imgData, 'PNG', 0, 0, pageWidth, pageHeight);
                }
                pdf.save('schedule.pdf');
            } catch (err) {
                console.error(err);
                alert("PDFの出力に失敗しました。");
            } finally {
                noPrintElements.forEach(el => el.style.display = '');
            }
        };

                    let nameHtml = '';
                    if (nameParts.length >= 2) {
                        nameHtml = `<div class="name-display-area"><div>${nameParts[0]}</div><div>${nameParts.slice(1).join(' ')}</div></div>${suffix}`;
                    } else {
                        nameHtml = `${rawName}${suffix}`;
                    }

                    let subHtml = ev.sub;
                    if (subHtml.includes(' (振替)')) {
                        subHtml = subHtml.replace(' (振替)', '<br><span class="text-[11px] font-normal text-slate-600">(振替)</span>');
                    } else if (subHtml.includes(' (講習)')) {
                        subHtml = subHtml.replace(' (講習)', '<br><span class="text-[11px] font-normal text-slate-600">(講習)</span>');
                    } else {
                        subHtml = subHtml.replace(/([^\s]+)\s*(\([^\)]+\))/, '$1<br><span class="text-[11px] font-normal text-slate-600">$2</span>');
                    }

                    todayList.innerHTML += `
                        <div class="grid-row" style="background:${ev.isSummer ? '#fff59d' : getColor(ev.time)}">
                            <div class="min-w-0 flex flex-col justify-center">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <strong class="text-sm truncate shrink-0 max-w-[180px]">${nameHtml}</strong>
                                </div>
                            </div>
                            <span class="text-xs md:text-sm font-medium leading-tight" style="word-break:break-word;">${subHtml}</span>
                            <div class="flex gap-1 shrink-0">
                                <button onclick="setAtt('${ev.id}','${ev.attKey}','出席','${ev.absKey || ''}', ${!!ev.isTrial || false})" class="att-btn ${ev.status === '出席' ? 'bg-blue-500 text-white' : ''}">出</button>
                                <button onclick="setAtt('${ev.id}','${ev.attKey}','欠席','${ev.absKey || ''}', ${!!ev.isTrial || false})" class="att-btn ${ev.status === '欠席' ? 'bg-red-500 text-white' : ''}">欠</button>
                                <button onclick="setAtt('${ev.id}','${ev.attKey}','無','${ev.absKey || ''}', ${!!ev.isTrial || false})" class="att-btn ${ev.status === '無' ? 'bg-slate-500 text-white' : ''}">無</button>
                                <button onclick="setAtt('${ev.id}','${ev.attKey}','取消','${ev.absKey || ''}', ${!!ev.isTrial || false})" class="att-btn">取</button>
                            </div>
                        </div>`;
                });
            });
        }; 

        window.setAtt = async (id, attKey, status, absKey='', isTrial=false) => { 
            const ref = doc(db, isTrial ? "trials" : "students", id); 
            const snap = await getDoc(ref); 
            let data = snap.data(); 
            let attendance = data.attendance || {}; 
            let reservations = data.makeupReservations || [];
            
            if (status === '取消') {
                delete attendance[attKey];
                if (!isTrial) {
                    reservations = reservations.filter(r => r.absKey !== attKey);
                }
            } else if (status === '出席') { 
                attendance[attKey] = '出席'; 
                if (attKey.startsWith('makeup_') && absKey) {
                    attendance[absKey] = '出席';
                }
            } else {
                attendance[attKey] = status;
            }
            
            await updateDoc(ref, { attendance, ...(isTrial ? {} : { makeupReservations: reservations }) });
            render();
        };

        window.cancelMakeup = async (id, absKey) => { if(!confirm("予約を取り消しますか？")) return; const ref = doc(db, "students", id); const snap = await getDoc(ref); let data = snap.data(); let res = (data.makeupReservations || []).filter(r => r.absKey !== absKey); await updateDoc(ref, { makeupReservations: res }); render(); }; 
        
        window.bookMakeupCustom = async (id, absKey) => { 
            const date = document.getElementById(`d-${absKey}`).value; 
            const time = document.getElementById(`t-${absKey}`).value; 
            const subject = document.getElementById(`sub-${absKey}`).value; 
            if(!date) return alert("日付を選択してください"); 
            const ref = doc(db, "students", id); 
            const snap = await getDoc(ref); 
            let data = snap.data(); 
            let res = (data.makeupReservations || []).filter(r => r.absKey !== absKey); 
            res.push({ absKey, date, time, completed: false, subject: subject }); 
            await updateDoc(ref, { makeupReservations: res }); 
            alert("予約完了しました"); 
            render(); 
        };

        window.bookMakeup = async (id, absKey, subject) => {
            window.bookMakeupCustom(id, absKey);
        };
        
        document.getElementById('search-box').onchange = (e) => { 
            const s = cachedData.find(i => i.id === e.target.value); 
            if (!s) return; 
            let famHtml = ""; 
            for (let i = 1; i <= 4; i++) { if (s['famName' + i]) famHtml += `<div class="text-xs border-b pb-1 mb-1"><strong>${s['famRel' + i] || '家族'}: ${s['famName' + i]}</strong><br>生年月日: ${s['famBirth' + i] || '-'} / 勤務先等: ${s['famWork' + i] || '-'}</div>`; } 
            document.getElementById('detail-view').innerHTML = `<div class="font-bold text-lg mb-2">${s.name} (${s.kana || ''})</div><div class="mb-2">ID: ${s.id}<br>学年: ${s.grade || '-'}<br>住所: ${s.zip || ''} ${s.addr || ''}<br>Tel: ${s.tel1 || ''} / ${s.tel2 || ''}<br>Email: ${s.email || ''}</div><div class="font-bold border-b mb-1">家族情報</div>${famHtml || '登録なし'}`; 
        }; 
        
        window.editMode = async (id) => { 
            window.editingId = id;
            const snap = await getDoc(doc(db, "students", id)); const s = snap.data(); document.getElementById('stu-id').value = id; document.getElementById('stu-name').value = s.name; document.getElementById('stu-kana').value = s.kana || ""; document.getElementById('stu-birth').value = s.birth || ""; document.getElementById('grade-result').innerText = s.grade || "-"; document.getElementById('zip').value = s.zip || ""; document.getElementById('addr').value = s.addr || ""; document.getElementById('email').value = s.email || ""; document.getElementById('tel1').value = s.tel1 || ""; document.getElementById('tel2').value = s.tel2 || ""; for(let i=1; i<=4; i++) { document.getElementById('fam-name'+i).value = s['famName'+i] || ""; document.getElementById('fam-kana'+i).value = s['famKana'+i] || ""; document.getElementById('fam-rel'+i).value = s['famRel'+i] || ""; document.getElementById('fam-birth'+i).value = s['famBirth'+i] || ""; document.getElementById('fam-grade'+i).innerText = window.calcGrade(s['famBirth'+i] || ""); document.getElementById('fam-work'+i).value = s['famWork'+i] || ""; } document.getElementById('delete-btn').classList.remove('hidden'); const container = document.getElementById('schedule-container'); container.innerHTML = ""; (s.schedules || []).forEach(sc => container.appendChild(createRow(sc.day, sc.time, sc.sub))); document.querySelectorAll('nav button')[0].click(); 
        }; 
        
        document.getElementById('add-schedule').onclick = () => document.getElementById('schedule-container').appendChild(createRow());
        document.getElementById('cal-today').onchange = render; 
        
        document.getElementById('save-btn').onclick = async () => { 
            const newId = document.getElementById('stu-id').value.trim(); 
            if(!newId) return alert("IDを入力してください"); 
            const oldId = window.editingId;
            const schedules = Array.from(document.querySelectorAll('.schedule-row')).map(row => ({ day: row.querySelector('.day').value, time: row.querySelector('.time').value, sub: row.querySelector('.sub').value })); 
            let famData = {}; 
            for(let i=1; i<=4; i++) { 
                famData['famName'+i] = document.getElementById('fam-name'+i).value; 
                famData['famKana'+i] = document.getElementById('fam-kana'+i).value; 
                famData['famRel'+i] = document.getElementById('fam-rel'+i).value; 
                famData['famBirth'+i] = document.getElementById('fam-birth'+i).value; 
                famData['famWork'+i] = document.getElementById('fam-work'+i).value; 
            } 
            const data = { name: document.getElementById('stu-name').value, kana: document.getElementById('stu-kana').value, birth: document.getElementById('stu-birth').value, grade: document.getElementById('grade-result').innerText, zip: document.getElementById('zip').value, addr: document.getElementById('addr').value, email: document.getElementById('email').value, tel1: document.getElementById('tel1').value, tel2: document.getElementById('tel2').value, schedules: schedules, ...famData };
            if (oldId && oldId !== newId) {
                const docSnap = await getDoc(doc(db, "students", oldId));
                if (docSnap.exists()) {
                    await setDoc(doc(db, "students", newId), { ...docSnap.data(), ...data });
                    await deleteDoc(doc(db, "students", oldId));
                }
            } else {
                await setDoc(doc(db, "students", newId), data, {merge: true});
            }
            if(window.pendingTrialConversion){ await deleteDoc(doc(db, "trials", window.pendingTrialConversion)); } 
            alert("保存しました");
            location.reload(); 
        }; 
        
        document.getElementById('save-trial').onclick = async () => { await addDoc(collection(db, "trials"), { name: document.getElementById('trial-name').value, grade: document.getElementById('trial-grade').value, sub: document.getElementById('trial-sub').value, date: document.getElementById('trial-date').value, time: document.getElementById('trial-time').value, registered: false }); location.reload(); };
        document.querySelectorAll('nav button').forEach((btn, i) => { btn.onclick = () => { document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active')); document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('nav-active-tab')); document.querySelectorAll('.tab-content')[i].classList.add('active'); btn.classList.add('nav-active-tab'); }; }); 
        onSnapshot(doc(db, "system", "config"), (doc) => { if(doc.exists()){ courseDates = doc.data(); const cs = document.getElementById('course-start'); const ce = document.getElementById('course-end'); if(cs) cs.value = courseDates.start || ''; if(ce) ce.value = courseDates.end || ''; } });
        onSnapshot(collection(db, "students"), async (snap) => { cachedData = snap.docs.map(doc => ({id: doc.id, ...doc.data()})); render(); });
        onSnapshot(collection(db, "trials"), (snap) => { trialsData = snap.docs.map(doc => ({id: doc.id, ...doc.data()})); render(); });
        document.getElementById('cancel-trial-convert').onclick = () => { if(!confirm('体験からの移行をキャンセルしますか？')) return; window.pendingTrialConversion = null; location.reload(); };
        document.getElementById('clear-btn').onclick = () => location.reload(); document.getElementById('delete-btn').onclick = async () => { if(!confirm("削除しますか？")) return; await deleteDoc(doc(db, "students", document.getElementById('stu-id').value)); location.reload(); };
        
        document.addEventListener('DOMContentLoaded', () => { 
            if (typeof YubinBango !== 'undefined') new YubinBango.Core(); 
            const today = new Date();
            const offset = today.getTimezoneOffset();
            const localDate = new Date(today.getTime() - (offset * 60 * 1000));
            document.getElementById('cal-today').value = localDate.toISOString().split('T')[0];
        });

        // パスワード認証画面表示中のソース表示・検証の抑止処理
        const authModal = document.getElementById('auth-modal');
        const preventSourceInspection = (e) => {
            if (!authModal.classList.contains('hidden')) {
                // 右クリックを禁止
                if (e.type === 'contextmenu') {
                    e.preventDefault();
                    return false;
                }
                // ショートカットキー（F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U 等）を禁止
                if (e.type === 'keydown') {
                    if (
                        e.key === 'F12' ||
                        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
                        (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
                    ) {
                        e.preventDefault();
                        return false;
                    }
                }
            }
        };
        document.addEventListener('contextmenu', preventSourceInspection);
        document.addEventListener('keydown', preventSourceInspection);
    </script>
</body>
</html>
